<template>
    <lightning-card class="slds-p-around_medium">
                    <lightning-layout multiple-rows>
                      <lightning-layout-item size="12" padding="around-small" small-device-size="3" medium-device-size="6"
                          large-device-size="9">
                          <p class="slds-text-heading_large"><b>Assessment04MarchAccountDataTable</b></p>
                      </lightning-layout-item>
                      <lightning-layout-item size="12" padding="around-small" small-device-size="3" medium-device-size="6"
                          large-device-size="3">
                          <div class="slds-p-top_small">
                            <lightning-button variant="brand" 
                                    label="Create New Account" onclick={handleCreateAccountButtonPopUpOnClick}>
                            </lightning-button>  
                        </div>
                      </lightning-layout-item>
                    </lightning-layout>

                          <lightning-datatable
                                key-field="id"
                                data={state.accountList}
                                columns={columns}>
                            </lightning-datatable>

                        <template if:true={state.showModalPopUpToCreateAccount}>
                            <c-lwc-assi2-child-component
                              oncloselightningmodalpopup={hideModalPopUpToCreateAccount}
                              is-small-modal
                              data-testid="sendToToolbeltLightningModal"
                            >
                              <span slot="modalTitle">Create New Account</span>
                              <span slot="modalBody">
                                <div class="slds-text-heading_small slds-p-around_medium">  
                                    <lightning-layout multiple-rows>
                                        <lightning-layout-item size="12" padding="around-small"  small-device-size="3" medium-device-size="6"
                                        large-device-size="12">
                                            <lightning-input type="text" label="Name" value={state.name} onchange={onChangeAccountInput}></lightning-input>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="12"  padding="around-small" small-device-size="3" medium-device-size="6"
                                        large-device-size="6">
                                            <lightning-input type="text" label="AccountNumber" onchange={onChangeAccountInput}></lightning-input>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="12" padding="around-small"  small-device-size="3" medium-device-size="6" large-device-size="6">
                                            <lightning-input type="text" label="Phone" onchange={onChangeAccountInput} value={state.phone}></lightning-input>
                                        </lightning-layout-item>
                                    </lightning-layout>            
                                    <lightning-button
                                        class="slds-m-top_small slds-align_absolute-center"
                                        label="Create new"
                                        onclick={handleCreateNewAccountButtonOnClick}
                                    >
                                    </lightning-button>
                            
                                  <!-- <b><i>{state.confirmationMessageForSendToToolbelt}</i></b> -->
                                </div>
                              </span>
                              <span slot="modalFooter">
                                <lightning-button
                                  label="Cancel"
                                  title="Cancel"
                                  onclick={hideModalPopUpToCreateAccount}
                                  class="slds-var-m-left_x-small"
                                  data-testid="cancelButton"
                                ></lightning-button>
                              </span>
                            </c-lwc-assi2-child-component>
                          </template>

                          <!-- Child Component to Create Contact Record -->
                          <template if:true={state.showModalPopUpToCreateContact}>
                            <c-lwc-assi2-child-component
                              oncloselightningmodalpopup={hideModalPopUpToCreateContact}
                              is-small-modal
                              data-testid="sendToToolbeltLightningModal"
                            >
                              <span slot="modalTitle">Create New Contact</span>
                              <span slot="modalBody">
                                <div class="slds-text-heading_small slds-p-around_medium">  
                                    <lightning-layout multiple-rows>
                                        <lightning-layout-item size="12" padding="around-small"  small-device-size="3" medium-device-size="6"
                                        large-device-size="12">
                                            <lightning-input type="text" label="AccountName" value={state.accNameToShowInContact} disabled></lightning-input>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="12"  padding="around-small" small-device-size="3" medium-device-size="6"
                                        large-device-size="6">
                                            <lightning-input type="text" label="FirstName" onchange={onChangeContactInput}></lightning-input>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="12" padding="around-small"  small-device-size="3" medium-device-size="6" large-device-size="6">
                                            <lightning-input type="text" label="LastName" onchange={onChangeContactInput} value={state.lastNameInput}></lightning-input>
                                            <template if:true={state.lastNameError}>
                                                <p class="slds-text-color_error">{state.lastNameError}</p>
                                            </template>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="12"  padding="around-small" small-device-size="3" medium-device-size="6" large-device-size="6">
                                            <lightning-input type="text" label="Email" onchange={onChangeContactInput} value={state.emailInput}></lightning-input>
                                            <template if:true={state.emailError}>
                                                <p class="slds-text-color_error">{state.emailError}</p>
                                            </template>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="12"  padding="around-small" small-device-size="3" medium-device-size="6"
                                        large-device-size="6">
                                            <lightning-input type="text" label="Phone" onchange={onChangeContactInput}></lightning-input>
                                        </lightning-layout-item>
                                    </lightning-layout>            
                                    <lightning-button
                                        class="slds-m-top_small slds-align_absolute-center"
                                        label="Create new"
                                        onclick={handleCreateNewContactButtonOnClick}
                                    >
                                    </lightning-button>
                            
                                  <!-- <b><i>{state.confirmationMessageForSendToToolbelt}</i></b> -->
                                </div>
                              </span>
                              <span slot="modalFooter">
                                <lightning-button
                                  label="Cancel"
                                  title="Cancel"
                                  onclick={hideModalPopUpToCreateContact}
                                  class="slds-var-m-left_x-small"
                                  data-testid="cancelButton"
                                ></lightning-button>
                              </span>
                            </c-lwc-assi2-child-component>
                          </template>
                        </lightning-card>
</template>
